<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas em Harmonia</title>
    <link rel="icon" href="imagens/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <div class="inner">
            <a class="brand" href="index.html">Receitas em Harmonia</a>
            <nav class="site-nav" aria-label="Principal">
                <a href="index.html" aria-current="page">Receitas</a>
                <a href="gerador.html">Cardápio da semana</a>
                <a href="estacoes.html">Estações</a>
            </nav>
        </div>
    </header>

    <div class="wrap">
        <main>
            <h1 class="visually-hidden">Receitas</h1>

            <input type="search" id="search" class="search-input" aria-label="Buscar receita"
                placeholder="Buscar receita por nome" oninput="filterRecipes()">

            <details class="filters" id="filters" open>
                <summary>Filtros<span id="filter-count"></span></summary>
            <div class="filter-group">
                <span class="filter-label" id="lbl-cat">Tipo</span>
                <div class="chips" role="group" aria-labelledby="lbl-cat">
                    <button class="chip active" data-cat="all" aria-pressed="true">Todos</button>
                    <button class="chip" data-cat="Prato Principal" aria-pressed="false">Prato principal</button>
                    <button class="chip" data-cat="Guarnição" aria-pressed="false">Guarnição</button>
                    <button class="chip" data-cat="Salada" aria-pressed="false">Salada</button>
                    <button class="chip" data-cat="Lanches" aria-pressed="false">Lanches</button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label" id="lbl-nut">Nutrição</span>
                <div class="chips" role="group" aria-labelledby="lbl-nut">
                    <button class="chip chip-tag" data-tag="Rico em proteína" aria-pressed="false">Rico em proteína</button>
                    <button class="chip chip-tag" data-tag="Rico em fibras" aria-pressed="false">Rico em fibras</button>
                    <button class="chip chip-tag" data-tag="Baixo carboidrato" aria-pressed="false">Baixo carboidrato</button>
                    <button class="chip chip-tag" data-tag="Leve" aria-pressed="false">Leve</button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label" id="lbl-mom">Momento</span>
                <div class="chips" role="group" aria-labelledby="lbl-mom">
                    <button class="chip chip-tag" data-tag="Pré-treino" aria-pressed="false">Pré-treino</button>
                    <button class="chip chip-tag" data-tag="Pós-treino" aria-pressed="false">Pós-treino</button>
                    <button class="chip chip-tag" data-tag="Café da manhã" aria-pressed="false">Café da manhã</button>
                    <button class="chip" id="verified-card" aria-pressed="false">Só verificadas</button>
                    <button class="chip" id="season-chip" aria-pressed="false" disabled title="Carregando calendário">Da estação</button>
                </div>
            </div>
            </details>

            <div class="results-bar">
                <span id="results-count" aria-live="polite"></span>
                <button id="clear-filters" class="d-none" type="button">Limpar filtros</button>
            </div>

            <div id="recipe-list" class="recipe-grid"></div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        const { esc, photoHTML, portions } = App;
        let recipes = [];
        let currentCategory = 'all';
        let verifiedOnly = false;
        let seasonOnly = false;
        const thisMonth = new Date().getMonth();
        const activeTags = new Set();
        // No celular os filtros começam recolhidos; no desktop ficam sempre abertos.
        const filtersEl = document.getElementById('filters');
        const mobileMQ = window.matchMedia('(max-width: 640px)');
        const syncFilters = () => { filtersEl.open = !mobileMQ.matches; };
        syncFilters();
        mobileMQ.addEventListener('change', syncFilters);
        const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

        async function loadRecipes() {
            try {
                recipes = await App.loadRecipes();
                try {
                    await App.loadSeasonal();
                    const sc = document.getElementById('season-chip');
                    sc.disabled = false;
                    sc.title = 'Receitas com ingredientes em safra em ' + App.MONTHS[thisMonth];
                    sc.textContent = 'Da estação (' + App.MONTHS[thisMonth].toLowerCase() + ')';
                } catch (e) { console.error('Sazonalidade indisponível', e); }
                filterRecipes();
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('recipe-list').innerHTML = `
                    <div class="empty-state">
                        Não foi possível carregar as receitas. Se abriu o arquivo direto do disco, use um servidor local (por exemplo, python3 -m http.server).
                    </div>`;
            }
        }

        function setupFilters() {
            document.querySelectorAll('.chip[data-cat]').forEach(chip => {
                chip.addEventListener('click', () => {
                    currentCategory = chip.dataset.cat;
                    document.querySelectorAll('.chip[data-cat]').forEach(c => {
                        const on = c === chip;
                        c.classList.toggle('active', on);
                        c.setAttribute('aria-pressed', on);
                    });
                    filterRecipes();
                });
            });
            document.querySelectorAll('.chip-tag').forEach(chip => {
                chip.addEventListener('click', () => {
                    const tag = chip.dataset.tag;
                    activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag);
                    chip.classList.toggle('active', activeTags.has(tag));
                    chip.setAttribute('aria-pressed', activeTags.has(tag));
                    filterRecipes();
                });
            });
            const v = document.getElementById('verified-card');
            v.addEventListener('click', () => {
                verifiedOnly = !verifiedOnly;
                v.classList.toggle('active', verifiedOnly);
                v.setAttribute('aria-pressed', verifiedOnly);
                filterRecipes();
            });
            const sc = document.getElementById('season-chip');
            sc.addEventListener('click', () => {
                seasonOnly = !seasonOnly;
                sc.classList.toggle('active', seasonOnly);
                sc.setAttribute('aria-pressed', seasonOnly);
                filterRecipes();
            });
            document.getElementById('clear-filters').addEventListener('click', clearFilters);
        }

        function clearFilters() {
            document.getElementById('search').value = '';
            if (verifiedOnly) document.getElementById('verified-card').click();
            if (seasonOnly) document.getElementById('season-chip').click();
            document.querySelectorAll('.chip-tag.active').forEach(c => c.click());
            document.querySelector('.chip[data-cat="all"]').click();
        }

        function filterRecipes() {
            const searchTerm = norm(document.getElementById('search').value);

            const filtered = recipes.filter(recipe => {
                const matchesType = currentCategory === 'all' || recipe.categorias.includes(currentCategory);
                const matchesSearch = norm(recipe.nome).includes(searchTerm);
                const matchesVerified = !verifiedOnly || recipe.verificado;
                const matchesTags = [...activeTags].every(t => (recipe.tags || []).includes(t));
                const matchesSeason = !seasonOnly || App.foodsInSeason(recipe, thisMonth).length > 0;
                return matchesType && matchesSearch && matchesVerified && matchesTags && matchesSeason;
            });

            displayRecipes(filtered);

            const n = filtered.length;
            document.getElementById('results-count').textContent = n + (n === 1 ? ' receita' : ' receitas');
            const dirty = searchTerm || currentCategory !== 'all' || verifiedOnly || seasonOnly || activeTags.size > 0;
            document.getElementById('clear-filters').classList.toggle('d-none', !dirty);
            const active = (currentCategory !== 'all' ? 1 : 0) + (verifiedOnly ? 1 : 0) + (seasonOnly ? 1 : 0) + activeTags.size;
            document.getElementById('filter-count').textContent = active ? ` (${active} ativos)` : '';
        }

        function displayRecipes(list) {
            const grid = document.getElementById('recipe-list');
            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <p class="m-0">Nenhuma receita com esses filtros.</p>
                        <button class="btn-text" type="button" id="empty-clear">Limpar filtros</button>
                    </div>`;
                document.getElementById('empty-clear').addEventListener('click', clearFilters);
                return;
            }

            grid.innerHTML = list.map(recipe => `
                <article class="recipe-card" data-name="${esc(recipe.nome)}" role="button" tabindex="0">
                    ${photoHTML(recipe)}
                    <div>
                        <h2 class="recipe-title">${esc(recipe.nome)}</h2>
                        <div class="recipe-meta">${portions(recipe)}${recipe.verificado ? ' · <span class="verified">verificada</span>' : ''}</div>
                    </div>
                </article>
            `).join('');

            grid.querySelectorAll('.recipe-card').forEach(card => {
                const open = () => App.showRecipeModal(recipes.find(r => r.nome === card.dataset.name));
                card.addEventListener('click', open);
                card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
            });
        }

        document.addEventListener('DOMContentLoaded', () => { setupFilters(); loadRecipes(); });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
