<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas em Harmonia</title>
    <link rel="icon" href="imagens/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">
    <div class="container main-container py-5">
        <!-- Discovery Hub (Bento Grid) -->
        <h1 class="visually-hidden">Hub de Receitas</h1>
        <div class="discovery-hub mb-5">
            <!-- Row 1: Search Card (Full Width) -->
            <div class="bento-card search-card">
                <h2 class="mb-3 fw-bold text-white">Descubra Sabores</h2>
                <div class="search-container w-100">
                    <div class="search-wrapper">
                        <input type="text" id="search" class="form-control search-input"
                            placeholder="O que vamos cozinhar hoje?" onkeyup="handleSearch()">
                        <span class="search-icon">🔍</span>
                    </div>
                    <button class="btn-generate" onclick="window.location.href='gerador.html'">
                        <span class="btn-icon">🎲</span>
                        <span class="btn-text">Gerar Cardápio</span>
                    </button>
                </div>
            </div>

            <!-- Row 2: Primary Filters -->
            <div class="filters-primary">
                <!-- Prato Principal -->
                <div class="bento-card category-card" onclick="selectCategory('Prato Principal', this)"
                    style="--hue: 350;">
                    <span class="cat-icon">🍖</span>
                    <span class="cat-name">Prato Principal</span>
                </div>

                <!-- Guarnição -->
                <div class="bento-card category-card" onclick="selectCategory('Guarnição', this)" style="--hue: 280;">
                    <span class="cat-icon">🥘</span>
                    <span class="cat-name">Guarnição</span>
                </div>

                <!-- Saladas -->
                <div class="bento-card category-card" onclick="selectCategory('Salada', this)" style="--hue: 150;">
                    <span class="cat-icon">🥗</span>
                    <span class="cat-name">Salada</span>
                </div>

                <!-- Lanches -->
                <div class="bento-card category-card" onclick="selectCategory('Lanches', this)" style="--hue: 45;">
                    <span class="cat-icon">🥪</span>
                    <span class="cat-name">Lanches</span>
                </div>

                <!-- Quitandas -->
                <div class="bento-card category-card" onclick="selectCategory('Quitandas', this)" style="--hue: 35;">
                    <span class="cat-icon">🍞</span>
                    <span class="cat-name">Quitandas</span>
                </div>
            </div>

            <!-- Row 3: Secondary Filters -->
            <div class="filters-secondary">
                <!-- Todos -->
                <div class="bento-card category-card active" onclick="selectCategory('all', this)" style="--hue: 220;">
                    <span class="cat-icon">🍽️</span>
                    <span class="cat-name">Todos</span>
                </div>

                <!-- Verified Toggle -->
                <div class="bento-card category-card" id="verified-card" onclick="toggleVerified(this)"
                    style="--hue: 190;">
                    <span class="cat-icon">✔</span>
                    <span class="cat-name">Verificados</span>
                </div>
            </div>
        </div>

        <!-- Recipe Grid (Results) -->
        <div id="recipe-list" class="recipe-grid"></div>

        <!-- Details View -->
        <div id="recipe-details" class="mt-4 d-none recipe-details-container"></div>
    </div>

    <script>
        let recipes = [];
        let currentCategory = 'all';
        let verifiedOnly = false;

        async function loadRecipes() {
            try {
                const response = await fetch('receitas.json');
                if (!response.ok) throw new Error('Erro ao carregar receitas');
                recipes = await response.json();
                filterRecipes();
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('recipe-list').innerHTML = `
                    <div class="alert alert-danger">
                        Erro ao carregar as receitas. Por favor, recarregue a página.
                    </div>
                `;
            }
        }

        function selectCategory(category, element) {
            currentCategory = category;

            // Visual feedback
            document.querySelectorAll('.category-card').forEach(el => {
                if (el !== document.getElementById('verified-card')) el.classList.remove('active');
            });
            element.classList.add('active');

            filterRecipes();
        }

        function toggleVerified(element) {
            verifiedOnly = !verifiedOnly;
            element.classList.toggle('active', verifiedOnly);
            filterRecipes();
        }

        function handleSearch() {
            filterRecipes();
        }

        function filterRecipes() {
            const searchTerm = document.getElementById('search').value.toLowerCase().trim();

            const filteredRecipes = recipes.filter(recipe => {
                const matchesType = currentCategory === "all" || recipe.categorias.includes(currentCategory);
                const matchesSearch = recipe.nome.toLowerCase().includes(searchTerm);
                const matchesVerified = !verifiedOnly || recipe.verificado;

                return matchesType && matchesSearch && matchesVerified;
            });

            displayRecipes(filteredRecipes);
        }

        function displayRecipes(filteredRecipes) {
            const list = document.getElementById('recipe-list');
            if (filteredRecipes.length === 0) {
                list.innerHTML = '<div class="col-12 text-center text-muted py-5" style="grid-column: 1/-1;"><h3>Nenhuma receita encontrada 😕</h3></div>';
                return;
            }

            list.innerHTML = filteredRecipes.map(recipe => `
                <div class="recipe-card" onclick="showRecipe('${recipe.nome}')" role="button" tabindex="0">
                    <div class="recipe-bg" style="background-image: url('imagens/${recipe.image}'), url('imagens/placeholder.jpg');"></div>
                    <div class="recipe-overlay"></div>
                    <div class="recipe-content">
                        ${recipe.verificado ? '<span class="verified-badge">✔</span>' : ''}
                        <div class="recipe-info">
                            <span class="recipe-meta">${recipe.porção} Porções</span>
                            <h3 class="recipe-title">${recipe.nome}</h3>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showRecipe(name) {
            const recipe = recipes.find(r => r.nome === name);
            if (recipe) {
                document.getElementById('recipe-list').classList.add('d-none');
                document.querySelector('.discovery-hub').classList.add('d-none');

                const detailsDiv = document.getElementById('recipe-details');
                detailsDiv.classList.remove('d-none');
                window.scrollTo(0, 0);

                detailsDiv.innerHTML = `
                    <div class="details-card fade-in">
                        <button class="btn btn-outline-dark rounded-pill mb-4" onclick="goBack()">← Voltar para Menu</button>
                        
                         <div class="row g-5">
                            <div class="col-md-5">
                                <div class="details-img-container shadow-lg">
                                    <img src="imagens/${recipe.image}" class="details-img" alt="${recipe.nome}" onerror="this.src='imagens/placeholder.jpg'">
                                </div>
                            </div>
                            <div class="col-md-7">
                                <h1 class="display-4 fw-bold mb-3">${recipe.nome}</h1>
                                
                                <div class="d-flex flex-wrap gap-2 mb-4">
                                    ${recipe.categorias.map(cat => `<span class="badge bg-dark rounded-pill px-3 py-2">${cat}</span>`).join('')}
                                    ${recipe.verificado ? '<span class="badge bg-success rounded-pill px-3 py-2">Receita Verificada ✔</span>' : ''}
                                </div>

                                <div class="ingredients-box p-4 bg-white rounded-4 shadow-sm border mb-4">
                                    <h4 class="mb-3 border-bottom pb-2">🛒 Ingredientes</h4>
                                    <ul class="list-unstyled m-0">
                                        ${Object.entries(recipe.ingredientes).map(([key, value]) => `
                                            <li class="d-flex justify-content-between py-2 border-bottom-dashed">
                                                <span class="text-secondary">${key}</span>
                                                <span class="fw-bold text-dark">${value}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                         </div>
                         
                         <div class="mt-4 p-5 bg-white rounded-4 shadow-sm border">
                            <h3 class="mb-4">👨‍🍳 Modo de Preparo</h3>
                            <div class="steps-list">
                                ${recipe.receita.map((step, index) => `
                                    <div class="step-item d-flex gap-3 mb-4">
                                        <div class="step-number">${index + 1}</div>
                                        <p class="step-text m-0 align-self-center fs-5">${step}</p>
                                    </div>
                                `).join('')}
                            </div>
                         </div>
                    </div>
                `;
            }
        }

        function goBack() {
            document.getElementById('recipe-list').classList.remove('d-none');
            document.querySelector('.discovery-hub').classList.remove('d-none');
            document.getElementById('recipe-details').classList.add('d-none');
        }

        document.addEventListener('DOMContentLoaded', loadRecipes);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
